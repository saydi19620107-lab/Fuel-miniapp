<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бензин Якутии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    margin: 0; padding: 0; min-height: 100vh;
  }
  .header {
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    padding: 14px 16px; position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(128,128,128,0.15);
  }
  .back-btn {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: var(--tg-theme-link-color, #2481cc); padding: 0; width: 32px;
    display: none;
  }
  .back-btn.visible { display: block; }
  .title { font-size: 18px; font-weight: 600; flex: 1; }
  .content { padding: 16px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    padding: 16px; border-radius: 12px; cursor: pointer;
    font-size: 16px; transition: opacity 0.15s;
    border: none; color: inherit; text-align: left; width: 100%;
  }
  .item:active { opacity: 0.7; }
  .item-title { font-weight: 600; margin-bottom: 4px; }
  .item-sub { font-size: 13px; color: var(--tg-theme-hint-color, #999); }
  .loading { text-align: center; padding: 40px; color: var(--tg-theme-hint-color, #999); }
  .fuel-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    border-radius: 10px; margin-bottom: 8px;
  }
  .fuel-name { font-weight: 600; font-size: 16px; }
  .fuel-status { font-size: 14px; }
  .time { font-size: 12px; color: var(--tg-theme-hint-color, #999); }
  .buttons-row {
    display: flex; gap: 8px; margin-top: 6px; margin-bottom: 14px;
  }
  .btn-status {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn-yes { background: #4caf50; color: white; }
  .btn-low { background: #ffc107; color: black; }
  .btn-no { background: #f44336; color: white; }
  .btn-status:active { opacity: 0.7; }
  .section-title { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" id="backBtn">←</button>
  <div class="title" id="headerTitle">⛽ Бензин Якутии</div>
</div>

<div class="content" id="content">
  <div class="loading">Загрузка...</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://fuel-bot-production.up.railway.app";
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let currentView = { type: "cities" };
let currentCity = null;
let currentStation = null;

const content = document.getElementById("content");
const headerTitle = document.getElementById("headerTitle");
const backBtn = document.getElementById("backBtn");

backBtn.addEventListener("click", () => {
  if (currentView.type === "stations") showCities();
  else if (currentView.type === "station") showStations(currentCity);
});

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

async function showCities() {
  currentView = { type: "cities" };
  headerTitle.textContent = "⛽ Бензин Якутии";
  backBtn.classList.remove("visible");
  content.innerHTML = '<div class="loading">Загрузка городов...</div>';
  try {
    const res = await fetch(API + "/api/cities");
    const data = await res.json();
    if (!data.cities || data.cities.length === 0) {
      content.innerHTML = '<div class="loading">Города не найдены</div>';
      return;
    }
    let html = '<div class="list">';
    for (const city of data.cities) {
      html += `<button class="item" data-city="${escape(city)}">${city}</button>`;
    }
    html += '</div>';
    content.innerHTML = html;
    content.querySelectorAll("[data-city]").forEach(btn => {
      btn.addEventListener("click", () => {
        const city = btn.getAttribute("data-city");
        showStations(unescape(city));
      });
    });
  } catch (e) {
    content.innerHTML = '<div class="loading">Ошибка загрузки. Проверьте интернет.</div>';
  }
}

async function showStations(city) {
  currentView = { type: "stations" };
  currentCity = city;
  headerTitle.textContent = "📍 " + city;
  backBtn.classList.add("visible");
  content.innerHTML = '<div class="loading">Загрузка АЗС...</div>';
  try {
    const res = await fetch(API + "/api/stations?city=" + encodeURIComponent(city));
    const data = await res.json();
    if (!data.stations || data.stations.length === 0) {
      content.innerHTML = '<div class="loading">Нет АЗС в этом городе</div>';
      return;
    }
    let html = '<div class="list">';
    for (const s of data.stations) {
      html += `<button class="item" data-sid="${s.id}">
        <div class="item-title">${s.name}</div>
        <div class="item-sub">${s.address || ""}</div>
      </button>`;
    }
    html += '</div>';
    content.innerHTML = html;
    content.querySelectorAll("[data-sid]").forEach(btn => {
      btn.addEventListener("click", () => {
        const sid = parseInt(btn.getAttribute("data-sid"));
        showStation(sid);
      });
    });
  } catch (e) {
    content.innerHTML = '<div class="loading">Ошибка загрузки</div>';
  }
}

const FUEL_LIST = ["АИ-92", "АИ-95", "АИ-98", "ДТ"];
const STATUS_ICONS = { yes: "🟢 Есть", low: "🟡 Мало", no: "🔴 Нет" };

async function showStation(sid) {
  currentView = { type: "station" };
  content.innerHTML = '<div class="loading">Загрузка данных...</div>';
  try {
    const res = await fetch(API + "/api/station/" + sid);
    const st = await res.json();
    if (st.error) {
      content.innerHTML = '<div class="loading">АЗС не найдена</div>';
      return;
    }
    currentStation = st;
    headerTitle.textContent = "⛽ " + st.name;
    backBtn.classList.add("visible");

    let html = `<div class="item-sub" style="margin-bottom:14px">📍 ${st.city}, ${st.address || ""}</div>`;
    html += '<div class="section-title">Статус топлива</div>';

    for (const fuel of FUEL_LIST) {
      const f = st.fuels[fuel];
      let statusText = "⚪ Нет данных";
      let timeText = "";
      if (f) {
        statusText = STATUS_ICONS[f.status] || f.status;
        timeText = f.time;
      }
      html += `<div class="fuel-row">
        <span class="fuel-name">${fuel}</span>
        <span class="fuel-status">${statusText} <span class="time">${timeText}</span></span>
      </div>`;
    }

    html += '<div class="section-title">Отметить наличие</div>';
    for (const fuel of FUEL_LIST) {
      html += `<div style="margin-bottom:6px; font-size:14px; color:var(--tg-theme-hint-color)">${fuel}</div>`;
      html += `<div class="buttons-row">
        <button class="btn-status btn-yes" data-fuel="${fuel}" data-status="yes">🟢 Есть</button>
        <button class="btn-status btn-low" data-fuel="${fuel}" data-status="low">🟡 Мало</button>
        <button class="btn-status btn-no" data-fuel="${fuel}" data-status="no">🔴 Нет</button>
      </div>`;
    }
    content.innerHTML = html;

    content.querySelectorAll(".btn-status").forEach(btn => {
      btn.addEventListener("click", async () => {
        const fuel = btn.getAttribute("data-fuel");
        const status = btn.getAttribute("data-status");
        await sendReport(sid, fuel, status);
      });
    });
  } catch (e) {
    content.innerHTML = '<div class="loading">Ошибка загрузки</div>';
  }
}

async function sendReport(sid, fuel, status) {
  try {
    const res = await fetch(API + "/api/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        station_id: sid,
        fuel: fuel,
        status: status,
        user_id: tg.initDataUnsafe?.user?.id || 0
      })
    });
    const data = await res.json();
    if (data.ok) {
      toast("✅ Спасибо! Отметили");
      setTimeout(() => showStation(sid), 500);
    } else {
      toast("❌ Ошибка: " + (data.error || ""));
    }
  } catch (e) {
    toast("❌ Ошибка отправки");
  }
}

showCities();
</script>
</body>
</html>
