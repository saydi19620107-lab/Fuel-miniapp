<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бензин Якутии</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container { text-align: center; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        p { font-size: 16px; margin-bottom: 30px; color: var(--tg-theme-hint-color, #999); }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 14px 28px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            max-width: 300px;
        }
        button:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛽ Бензин Якутии</h1>
        <p>Проверяйте наличие топлива на АЗС республики</p>
        <button id="addBtn">📲 Добавить на главный экран</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const btn = document.getElementById('addBtn');
        btn.addEventListener('click', () => {
            if (tg.addToHomeScreen) {
                tg.addToHomeScreen();
            } else {
                alert('Функция недоступна на этом устройстве');
            }
        });

        if (!tg.addToHomeScreen) {
            btn.style.display = 'none';
        }
    </script>
</body>
</html>
